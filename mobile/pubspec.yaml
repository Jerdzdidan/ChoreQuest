name: chorequest
description: "ChoreQuest mobile client"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  camera: ^0.12.1
  confetti: ^0.8.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.0
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Free art (L1): Kenney's packs, CC0, and game-icons.net badges, CC BY 3.0.
  # The credits screen names every author the licence asks for.
  assets:
    - assets/cosmetics/layers/
    - assets/cosmetics/icons/
    - assets/cosmetics/outfits/
    - assets/cosmetics/headwear/
    - assets/cosmetics/pets/
    - assets/cosmetics/rugs/
    - assets/cosmetics/wall/
    - assets/cosmetics/plants/
    - assets/cosmetics/chapters/
    - assets/badges/
